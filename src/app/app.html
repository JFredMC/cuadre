<a class="skip" href="#main">Saltar al contenido</a>
<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Cuadre, inicio">
    <span class="logo" aria-hidden="true">▦</span> Cuadre
  </a>
  <nav aria-label="Calculadoras">
    <ul class="nav">
      @for (c of calculators; track c.slug) {
        <li>
          <a [routerLink]="['/', c.slug]" routerLinkActive="active">{{ c.name }}</a>
        </li>
      }
    </ul>
  </nav>
</header>
<main id="main" class="container">
  <router-outlet />
</main>
<footer class="footer">
  <p>
    <strong>Cuadre</strong> · Calculadoras laborales para Colombia. Resultados aproximados, no son
    asesoría legal.
  </p>
  <p>
    ¿Buscas ahorrar en el mercado? Compara precios en
    <a [href]="napa" target="_blank" rel="noopener noreferrer">napaofertas.com</a>
  </p>
  <p class="signature">
    Hecho por <a [href]="portfolio" target="_blank" rel="noopener noreferrer">JFredDev</a>
  </p>
</footer>
